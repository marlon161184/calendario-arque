document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  const FONT_MIME = /^(font[/]|application[/](x-)?font-|application[/]vnd\.ms-fontobject)/i;
  const MIME_TOKEN = /^[\w.+-]+[/][\w.+-]+$/;
  function toBase64(bytes) {
    let bin = '';
    for (let i = 0; i < bytes.length; i += 0x8000) {
      bin += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000));
    }
    return btoa(bin);
  }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    // Failed resource loads (CSP-blocked links, scripts, images) fire plain
    // events at the element — warn only; real JS errors carry message/error.
    if (!e.message && !e.error && e.target && e.target !== window) {
      console.warn('[bundle] resource failed to load:',
        e.target.tagName, String(e.target.src || e.target.href || ''));
      return;
    }
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';
    d.textContent = (d.textContent ? d.textContent + String.fromCharCode(10) : '') +
      '[bundle] ' + (e.message || e.type) +
      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');
  }, true);

  try {
    const manifestEl = document.querySelector('script[type="__bundler/manifest"]');
    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    // Nested page bundles (iframe targets). Each ships ONCE, in the ROOT
    // document's manifest; frame srcs carry an about:blank#<uuid> marker
    // instead of a substitutable uuid. Every document mints the blobs for
    // its OWN frames — from local text at the root, or text obtained from
    // its DIRECT parent over the relay protocol below — so each frame
    // navigation stays same-origin with its initiator and a deduped page
    // loads at any depth on any host, including a file:// download's
    // opaque origins (where a blob minted by one document cannot be
    // navigated to by another).
    const pageOrderEl = document.querySelector('script[type="__bundler/page_order"]');
    const pageOrder = pageOrderEl ? JSON.parse(pageOrderEl.textContent) : [];
    const pageSet = new Set(pageOrder);
    const pageTexts = {};

    // ── Nested-page text protocol (parent-chain relay) ──
    // Page bundles ship once, in the ROOT document's manifest. Every
    // document mints the blobs for its OWN frames, obtaining page text
    // through a strict parent-chain relay: a document only ever SENDS to
    // its direct parent (which, for every document the publisher's own
    // runtime minted, is another publisher document) and only ACCEPTS
    // text from that direct parent; requests from below are honored only
    // for the document's own child frames, and the ROOT never sends
    // upward at all. That last rule is load-bearing: the artifact host's
    // frame-ancestors allows claude.ai (and friends) to frame an
    // artifact, so window.top can be a FOREIGN document — a top-addressed
    // protocol would hand page uuids to that ancestor and accept forged
    // "page text" from it, minting attacker HTML as an artifact-origin
    // blob document. The chain never touches the ancestor: requests stop
    // at the root, replies are origin-addressed per hop (never '*' when
    // an origin exists), and both directions are origin-gated (on https
    // a foreign sender's origin can never equal this document's; in
    // opaque contexts — file:// — everything serializes as 'null', where
    // an embedded EXTERNAL frame still fails the gate by carrying its
    // own real origin, and a sandboxed child of such a frame is excluded
    // by the own-child-frames check plus uuid unguessability). Shape is
    // deny-by-default: one request form, one reply form, no error
    // replies.
    // window.origin is the SERIALIZED SECURITY origin ('null' in opaque
    // contexts such as a sandboxed preview iframe) — location.origin is
    // computed from the URL and stays 'https://…' even when the document
    // is sandboxed, which would misgate every opaque chain.
    const OWN_TARGET = /^https?:[/][/]/.test(window.origin || '')
      ? window.origin
      : '*';
    function trustedOrigin(e) {
      if (e.origin === window.origin) return true; // https chains; opaque==opaque
      // file:// trees: Chrome serializes the file document's origin as
      // 'file://' while the blob: documents it mints serialize as 'null',
      // so the two legitimate shapes can never string-match — accept the
      // pair in both directions. https origins never serialize as either,
      // and sender identity (own child frame / direct parent) is checked
      // separately.
      return (
        (e.origin === 'null' &&
          (window.origin === 'file://' ||
            window.location.protocol === 'file:')) ||
        (/^file:/.test(e.origin) && window.origin === 'null')
      );
    }
    // Non-empty only in the root document (nested bundles ship an empty
    // island), so it doubles as the root marker: the root answers from
    // local text and treats a miss as authoritative — never relaying to
    // its (possibly foreign) parent.
    const isPageRoot = pageOrder.length > 0;
    const blobUrls = {};
    const resourceBlobs = {};
    const UUID_SHAPE = /^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/;
    const pendingFrames = {}; // uuid -> [{el, frag}] awaiting text for own frames
    const pendingRelays = {}; // uuid -> [childWindow] awaiting text to pass down
    function mountPage(el, frag, text) {
      const pageBlob = new Blob([text], { type: 'text/html' });
      const u = URL.createObjectURL(pageBlob);
      resourceBlobs[u] = pageBlob;
      el.src = u + frag;
    }
    function deliverPage(uuid, text) {
      const frames = pendingFrames[uuid];
      delete pendingFrames[uuid];
      if (frames) for (const f of frames) mountPage(f.el, f.frag, text);
      const relays = pendingRelays[uuid];
      delete pendingRelays[uuid];
      if (relays) {
        for (const cw of relays) {
          try { cw.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
        }
      }
    }
    function ownFrameWindows() {
      const out = [];
      for (const f of Array.from(document.querySelectorAll('iframe'))) {
        try { if (f.contentWindow) out.push(f.contentWindow); } catch (err) { /* detached */ }
      }
      return out;
    }
    window.addEventListener('message', function (e) {
      const d = e.data;
      if (!d || typeof d !== 'object' || !e.source) return;
      // Origin gate first; the structural checks below (own-child-frames
      // for requests, direct-parent + solicited-uuid for replies, the
      // root's never-relay rule) are what hold in fully opaque chains
      // where origin strings can't discriminate — a sandboxed root's
      // FOREIGN wrapper still fails all three even though both serialize
      // as real-vs-'null' rather than matching.
      if (!trustedOrigin(e)) return;
      if (typeof d.__bundler_need === 'string' && UUID_SHAPE.test(d.__bundler_need)) {
        // Requests are honored only for this document's own child frames.
        if (ownFrameWindows().indexOf(e.source) < 0) return;
        const uuid = d.__bundler_need;
        const text = pageTexts[uuid];
        if (typeof text === 'string') {
          try { e.source.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
          return;
        }
        if (isPageRoot || window.parent === window) return; // authoritative miss
        const waiting = pendingRelays[uuid];
        if (waiting) {
          if (waiting.indexOf(e.source) < 0) waiting.push(e.source);
          return;
        }
        // Never-answered uuids would otherwise accumulate forever under a
        // request spray; past the cap (far above any real page count) new
        // relays are dropped rather than remembered.
        if (Object.keys(pendingRelays).length >= 128) return;
        pendingRelays[uuid] = [e.source];
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      } else if (
        typeof d.__bundler_page === 'string' &&
        UUID_SHAPE.test(d.__bundler_page) &&
        typeof d.__bundler_text === 'string'
      ) {
        // The shape test is load-bearing beyond tidiness: the solicited
        // check below uses the in operator, which matches prototype keys
        // ('__proto__', 'constructor') — an unshaped key would reach
        // deliverPage and throw, painting the error banner.
        // Text is accepted only from the direct parent — the document
        // that minted this one.
        if (e.source !== window.parent || window.parent === window) return;
        if (!(d.__bundler_page in pendingFrames) && !(d.__bundler_page in pendingRelays)) return;
        deliverPage(d.__bundler_page, d.__bundler_text);
      }
    });

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        if (pageSet.has(uuid)) {
          pageTexts[uuid] = new TextDecoder().decode(finalBytes);
          return;
        }
        if (FONT_MIME.test(entry.mime) && MIME_TOKEN.test(entry.mime)) {
          // Strict artifact hosts allow font-src data: but not blob:.
          blobUrls[uuid] = 'data:' + entry.mime + ';base64,' +
            (entry.compressed ? toBase64(finalBytes) : entry.data);
        } else {
          const blob = new Blob([finalBytes], { type: entry.mime });
          blobUrls[uuid] = URL.createObjectURL(blob);
          resourceBlobs[blobUrls[uuid]] = blob;
        }
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        const blob = new Blob([], { type: entry.mime });
        blobUrls[uuid] = URL.createObjectURL(blob);
        resourceBlobs[blobUrls[uuid]] = blob;
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    // Artifact-host CSP (connect-src 'self') refuses fetch() of blob: URLs —
    // consumers read these Blobs directly. Survives the swap like the error sink.
    window.__resourceBlobs = resourceBlobs;

    setStatus('Rendering...');
    // Page uuids have no blob here — they ride inside about:blank#<uuid>
    // frame markers the pass below resolves after the swap.
    for (const uuid of uuids) {
      if (pageSet.has(uuid)) continue;
      template = template.split(uuid).join(blobUrls[uuid]);
    }

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).replace(/<\//g, '<\\/') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);

    // Resolve page-frame markers: mint this document's own blob for each
    // framed page — from local text when this is the root, otherwise by
    // asking the direct parent over the relay protocol above. An
    // unanswered request leaves the frame on about:blank, the same
    // degraded state as a refused embed.
    {
      const MARKER = /^about:blank#([0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12})(#.*)?$/;
      const needed = [];
      for (const el of Array.from(document.querySelectorAll('iframe'))) {
        const m = MARKER.exec(el.getAttribute('src') || '');
        if (!m) continue;
        const text = pageTexts[m[1]];
        if (typeof text === 'string') {
          mountPage(el, m[2] || '', text);
        } else if (window.parent !== window && !isPageRoot) {
          const had = pendingFrames[m[1]];
          (pendingFrames[m[1]] = had || []).push({ el: el, frag: m[2] || '' });
          if (!had) needed.push(m[1]);
        }
      }
      for (const uuid of needed) {
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      }
    }

    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: read and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const pre = resourceBlobs[s.src.split('#')[0]];
        s.textContent = pre ? await pre.text() : await (await fetch(s.src)).text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

:'Instrument Sans';font-weight:500;src:url(\"845d06d5-3b5d-45fa-96e3-227e71052aca\") format('woff2')}\n@font-face{font-family:'Instrument Sans';font-weight:600;src:url(\"912babb5-95a2-41cb-80d3-e52a1acd9ead\") format('woff2')}\n@font-face{font-family:'Instrument Sans';font-weight:700;src:url(\"c0e2c8e2-ee50-4068-8858-d354065a0320\") format('woff2')}\n@font-face{font-family:'Inter';font-weight:400;src:url(\"17dc96f2-b7d0-4313-bdee-711b86b74c5a\") format('woff2')}\n@font-face{font-family:'Inter';font-weight:500;src:url(\"806a584a-8907-4eaa-9830-857c110718d7\") format('woff2')}\n@font-face{font-family:'Inter';font-weight:600;src:url(\"a497ef81-0ff4-4c50-b69d-e60a20e08c47\") format('woff2')}\n@font-face{font-family:'IBM Plex Mono';font-weight:400;src:url(\"bcf70242-ff4e-4529-8820-1472f61aae02\") format('woff2')}\n@font-face{font-family:'IBM Plex Mono';font-weight:500;src:url(\"2936147b-0ff7-44f3-9fbd-5f363a4ba98e\") format('woff2')}\n:root{\n--font-display:'Instrument Sans','Inter',sans-serif;--font-body:'Inter',system-ui,sans-serif;--font-mono:'IBM Plex Mono',ui-monospace,monospace;\n--display-weight:600;--display-tracking:-.03em;--display-leading:.98;--label-tracking:.14em;--body-leading:1.5;\n--fs-label:12px;--fs-small:14px;--fs-body:16px;--fs-lead:20px;--fs-h3:28px;--fs-h2:44px;--fs-h1:88px;--fs-hero:150px;\n}\nbody{font-family:var(--font-body);color:var(--text-1);-webkit-font-smoothing:antialiased;margin:0}\n.t-display{font-family:var(--font-display);font-weight:var(--display-weight);letter-spacing:var(--display-tracking);line-height:var(--display-leading)}\n.t-label{font-family:var(--font-mono);font-weight:500;text-transform:uppercase;letter-spacing:var(--label-tracking)}\n\n:root{\n--space-1:4px;--space-2:8px;--space-3:12px;--space-4:16px;--space-5:24px;--space-6:32px;--space-7:48px;--space-8:64px;--space-9:96px;\n--grid-col:160px;--slide-margin:160px;\n--radius-0:0;--radius-tile:22%;--radius-pill:999px;\n--rule-1:1px solid var(--carvao);--rule-2:2px solid var(--carvao);\n--shadow-none:none;\n--ease:cubic-bezier(.2,0,0,1);/* @kind other */--dur-fast:120ms;/* @kind other */--dur:200ms;/* @kind other */\n}\n\n<\u002Fstyle>\n<script src=\"e00a1916-4c52-4d16-8f56-8ed3ef7b2db4\"><\u002Fscript>\n<style>body{margin:0;background:#E9EAE5;color:#0B1115;font-family:Inter,sans-serif}a{color:#2A3DE0}a:hover{color:#0B1115}textarea,input{font-family:Inter,sans-serif}<\u002Fstyle>\n<\u002Fhelmet>\n<div style=\"max-width:1560px;margin:0 auto;padding:{{ pad }};display:flex;flex-direction:column;gap:40px\">\n  <header style=\"display:flex;flex-direction:column;gap:28px\">\n    <div style=\"display:flex;justify-content:space-between;gap:16px;flex-wrap:wrap;font:500 12px/1 'IBM Plex Mono',monospace;letter-spacing:.14em;text-transform:uppercase\"><span>Arquê · Calendário de lançamento<\u002Fspan><span>Por princípio.<\u002Fspan><\u002Fdiv>\n    <div style=\"border-top:2px solid #0B1115;padding-top:28px;display:grid;grid-template-columns:{{ headCols }};gap:28px;align-items:end\">\n      <div style=\"display:flex;flex-direction:column;gap:16px\">\n        <h1 style=\"font:600 clamp(40px,6vw,80px)/.98 'Instrument Sans',sans-serif;letter-spacing:-.03em;margin:0\">Novembro e dezembro de 2026<\u002Fh1>\n        <p style=\"margin:0;font:400 17px/1.5 Inter,sans-serif;color:#4A545B;max-width:60ch\">Marque cada entrega ao concluir, anote o andamento por semana e inclua tarefas novas em qualquer dia. As alterações ficam salvas neste navegador.<\u002Fp>\n      <\u002Fdiv>\n      <div style=\"display:flex;flex-direction:column;gap:12px\">\n        <div style=\"display:flex;justify-content:space-between;font:500 12px/1 'IBM Plex Mono',monospace;letter-spacing:.14em;text-transform:uppercase\"><span>Progresso<\u002Fspan><span>{{ progressLabel }}<\u002Fspan><\u002Fdiv>\n        <div style=\"height:12px;background:#C9CCC6\"><div style=\"height:12px;background:#2A3DE0;width:{{ progressPct }}\"><\u002Fdiv><\u002Fdiv>\n        <div style=\"display:flex;gap:20px;flex-wrap:wrap;font:500 11px/1 'IBM Plex Mono',monospace;letter-spacing:.14em;text-transform:uppercase;color:#4A545B\">\n          <span style=\"display:flex;gap:8px;align-items:center\"><span style=\"width:14px;height:14px;border:1.5px solid #0B1115;box-sizing:border-box;background:#fff\"><\u002Fspan>Pendente<\u002Fspan>\n          <span style=\"display:flex;gap:8px;align-items:center\"><span style=\"width:14px;height:14px;background:#0B1115;color:#fff;display:inline-flex;align-items:center;justify-content:center;font:600 11px/1 'IBM Plex Mono',monospace\">^<\u002Fspan>Concluída<\u002Fspan>\n          <span style=\"display:flex;gap:8px;align-items:center\"><span style=\"color:#2A3DE0;font:600 13px/1 'IBM Plex Mono',monospace\">^<\u002Fspan>Prioridade<\u002Fspan>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fheader>\n\n  <div style=\"overflow-x:auto\">\n  <div style=\"min-width:{{ minW }};display:flex;flex-direction:column;gap:0\">\n    <div style=\"display:{{ dowShow }};grid-template-columns:repeat(7,minmax(0,1fr));border-top:2px solid #0B1115;border-bottom:1px solid #0B1115;background:#fff\">\n      <sc-for list=\"{{ dows }}\" as=\"d\" hint-placeholder-count=\"7\"><div style=\"padding:10px 12px;font:500 12px/1 'IBM Plex Mono',monospace;letter-spacing:.14em;text-transform:uppercase\">{{ d }}<\u002Fdiv><\u002Fsc-for>\n    <\u002Fdiv>\n    <sc-for list=\"{{ rows }}\" as=\"w\" hint-placeholder-count=\"7\">\n      <div style=\"display:flex;flex-direction:column\">\n        <div style=\"display:flex;justify-content:space-between;gap:16px;padding:20px 0 10px;font:500 12px/1.3 'IBM Plex Mono',monospace;letter-spacing:.14em;text-transform:uppercase\">\n          <span>{{ w.label }}<\u002Fspan><span style=\"color:#4A545B\">{{ w.count }}<\u002Fspan>\n        <\u002Fdiv>\n        <div style=\"display:grid;grid-template-columns:{{ gridCols }};border-top:1px solid #0B1115;border-left:1px solid #0B1115\">\n          <sc-for list=\"{{ w.days }}\" as=\"c\" hint-placeholder-count=\"7\">\n            <div style=\"background:{{ c.bg }};color:{{ c.fg }};border-right:1px solid #0B1115;border-bottom:1px solid #0B1115;min-height:{{ cellMin }};padding:12px 10px;display:{{ c.display }};flex-direction:column;gap:8px;outline:{{ c.outline }};outline-offset:-3px\">\n              <div style=\"display:flex;justify-content:space-between;align-items:baseline\">\n                <span style=\"font:600 26px/1 'Instrument Sans',sans-serif;letter-spacing:-.03em\">{{ c.num }}<\u002Fspan>\n                <span style=\"font:500 11px/1 'IBM Plex Mono',monospace;letter-spacing:.14em;text-transform:uppercase;color:{{ c.sub }}\">{{ c.tag }}<\u002Fspan>\n              <\u002Fdiv>\n              <sc-for list=\"{{ c.tasks }}\" as=\"t\" hint-placeholder-count=\"2\">\n                <div sc-camel-on-click=\"{{ t.toggle }}\" style=\"display:flex;gap:8px;align-items:flex-start;cursor:pointer;font:400 13px/1.35 Inter,sans-serif\" style-hover=\"opacity:.7\">\n                  <span style=\"flex:none;width:16px;height:16px;box-sizing:border-box;border:1.5px solid {{ t.boxBorder }};background:{{ t.boxBg }};color:#fff;display:inline-flex;align-items:center;justify-content:center;font:600 12px/1 'IBM Plex Mono',monospace;margin-top:1px\">{{ t.mark }}<\u002Fspan>\n                  <span style=\"min-width:0;text-decoration:{{ t.deco }};color:{{ t.color }}\"><span style=\"display:{{ t.prioShow }};color:{{ t.prioColor }};font:600 13px/1 'IBM Plex Mono',monospace;margin-right:4px\">^<\u002Fspan>{{ t.t }}<\u002Fspan>\n                <\u002Fdiv>\n              <\u002Fsc-for>\n              <div style=\"display:{{ c.addShow }};margin-top:auto\">\n                <div style=\"display:{{ c.btnShow }}\"><button sc-camel-on-click=\"{{ c.open }}\" style=\"all:unset;cursor:pointer;font:500 11px/1 'IBM Plex Mono',monospace;letter-spacing:.14em;text-transform:uppercase;color:{{ c.sub }};padding:4px 0\" style-hover=\"color:#2A3DE0\">+ Tarefa<\u002Fbutton><\u002Fdiv>\n                <input type=\"text\" placeholder=\"Nova tarefa e Enter\" value=\"{{ draft }}\" sc-camel-on-input=\"{{ onDraft }}\" sc-camel-on-key-down=\"{{ c.keydown }}\" sc-camel-on-blur=\"{{ cancelAdd }}\" style=\"display:{{ c.inputShow }};width:100%;box-sizing:border-box;border:1px solid #0B1115;padding:6px 8px;font:400 13px/1.2 Inter,sans-serif;background:#fff;color:#0B1115;outline:none;border-radius:0\">\n              <\u002Fdiv>\n            <\u002Fdiv>\n          <\u002Fsc-for>\n        <\u002Fdiv>\n        <textarea placeholder=\"Notas da semana\" value=\"{{ w.note }}\" sc-camel-on-input=\"{{ w.onNote }}\" rows=\"2\" style=\"margin-top:8px;border:1px dashed #4A545B;background:transparent;padding:10px 12px;font:400 14px/1.5 Inter,sans-serif;color:#0B1115;resize:vertical;outline:none;border-radius:0;display:block;width:100%;box-sizing:border-box\"><\u002Ftextarea>\n      <\u002Fdiv>\n    <\u002Fsc-for>\n  <\u002Fdiv>\n  <\u002Fdiv>\n\n  <footer style=\"border-top:2px solid #0B1115;padding-top:16px;display:flex;justify-content:space-between;gap:16px;flex-wrap:wrap;font:500 12px/1.4 'IBM Plex Mono',monospace;letter-spacing:.14em;text-transform:uppercase\">\n    <span>D-Day · sábado, 28/11/2026<\u002Fspan><span>Prioridade alta, com alarme às 9h nos Lembretes<\u002Fspan>\n  <\u002Ffooter>\n<\u002Fdiv>\n<\u002Fx-dc>\n<script type=\"text/x-dc\" data-dc-script=\"\">\nclass Component extends DCLogic {\n  state = { mobile: false, done: {}, notes: {}, custom: {}, adding: null, draft: '' };\n  componentWillUnmount() { window.removeEventListener('resize', this._rs); }\n  componentDidMount() {\n    this._rs = () => { const m = window.innerWidth < 820; if (m !== this.state.mobile) this.setState({ mobile: m }); };\n    this.setState({ mobile: window.innerWidth < 820 }); window.addEventListener('resize', this._rs);\n    try { const s = JSON.parse(localStorage.getItem('arque-cal-v1') || 'null'); if (s) this.setState({ done: s.done || {}, notes: s.notes || {}, custom: s.custom || {} }); } catch (e) {}\n  }\n  save(p) {\n    this.setState(p, () => { const { done, notes, custom } = this.state; try { localStorage.setItem('arque-cal-v1', JSON.stringify({ done, notes, custom })); } catch (e) {} });\n  }\n  renderVals() {\n    const S = this.state;\n    const T = {\n      '02/11': [['Agendar retrato profissional', 1]], '03/11': [['Avatar e capas de destaques'], ['Banner e página do LinkedIn']],\n      '04/11': [['Bio com \"Por princípio.\" e UTM']], '05/11': [['OG, favicon e preview de WhatsApp (testar o link)']], '06/11': [['Trilha licenciada e assinatura sonora', 1]],\n      '09/11': [['Roteiro V2 (manifesto)']], '10/11': [['Roteiro V3']], '11/11': [['Rascunho da carta do fundador', 1]], '12/11': [['Carrossel-manifesto']], '13/11': [['Realizar o retrato', 1]],\n      '16/11': [['V2 em 16:9 e 9:16']], '17/11': [['V2 em 4:5 e cortes de 15 s e 6 s']], '18/11': [['V2 versão muda com legenda'], ['V3 em 16:9 e 9:16']],\n      '19/11': [['V3 em 4:5, cortes e versão muda'], ['V1: variações que faltam']], '20/11': [['Grid inicial de 9 posts e capas de Reels'], ['Locução do manifesto']],\n      '23/11': [['Miolo da apresentação de credenciais']], '24/11': [['One-pagers: Estratégia e Pessoas']], '25/11': [['One-pagers: Marcas e Negócios'], ['E-mail de lançamento']],\n      '26/11': [['QR code com a identidade da marca'], ['Card-convite e texto de WhatsApp e e-mail']], '27/11': [['Checklist de governança em todas as peças'], ['Revisão final da carta', 1]],\n      '28/11': [['Carta no LinkedIn pessoal', 1], ['Stories \"Arquê está no ar\" (Jornada Autêntica e Arquitetura do Humano)'], ['Convites individuais por WhatsApp e e-mail']],\n      '29/11': [['Carrossel-manifesto (D+1)']], '01/12': [['V2: entrada fria (D+3)']], '06/12': [['V3: consideração (D+8)']], '13/12': [['V1: conversão, com CTA para o site e e-mail (D+15)']],\n    };\n    const dows = ['Dom', 'Seg', 'Ter', 'Qua', 'Qui', 'Sex', 'Sáb'];\n    const labels = ['Semana 1 · Fundação', 'Semana 2 · Narrativa', 'Semana 3 · Produção em lote', 'Semana 4 · Comercial e pré-lançamento · D-Day sáb 28/11', 'Pós-lançamento · 29/11 a 13/12', 'Pós-lançamento', 'Pós-lançamento'];\n    const now = new Date(); const todayKey = String(now.getDate()).padStart(2, '0') + '/' + String(now.getMonth() + 1).padStart(2, '0');\n    const pad = n => String(n).padStart(2, '0');\n    let total = 0, doneN = 0;\n    const rows = [];\n    for (let r = 0; r < 7; r++) {\n      const days = []; let rt = 0, rd = 0;\n      for (let c = 0; c < 7; c++) {\n        const off = r * 7 + c; const dt = new Date(2026, 10, 1 + off);\n        const dd = pad(dt.getDate()), mm = pad(dt.getMonth() + 1), key = dd + '/' + mm;\n        const inRange = (dt >= new Date(2026, 10, 2)) && (dt <= new Date(2026, 11, 13));\n        const isD = key === '28/11';\n        const base = (T[key] || []).map((x, i) => ({ id: key + '#' + i, t: x[0], p: x[1] }));\n        const extra = (S.custom[key] || []).map((x, i) => ({ id: key + '+' + i, t: x, p: 0 }));\n        const tasks = base.concat(extra).map(x => {\n          const dn = !!S.done[x.id]; if (inRange) { rt++; if (dn) rd++; }\n          const dark = isD;\n          return {\n            t: x.t, toggle: () => this.save({ done: Object.assign({}, S.done, { [x.id]: !dn }) }),\n            boxBorder: dark ? '#fff' : '#0B1115', boxBg: dn ? (dark ? '#2A3DE0' : '#0B1115') : (dark ? 'transparent' : '#fff'), mark: dn ? '^' : '',\n            deco: dn ? 'line-through' : 'none', color: dn ? (dark ? '#9AA7FF' : '#4A545B') : (dark ? '#fff' : '#0B1115'),\n            prioShow: x.p ? 'inline' : 'none', prioColor: dark ? '#9AA7FF' : '#2A3DE0',\n          };\n        });\n        const adding = S.adding === key;\n        days.push({\n          display: (S.mobile && !inRange) ? 'none' : 'flex',\n          num: dt.getDate(), tag: (S.mobile ? dows[c] + ' ' + (dt.getMonth() === 10 ? 'Nov' : 'Dez') + (isD ? ' · D-Day' : '') : (dt.getDate() === 1 ? (dt.getMonth() === 10 ? 'Nov' : 'Dez') : (isD ? 'D-Day' : ''))),\n          bg: isD ? '#0B1115' : inRange ? '#fff' : '#E9EAE5', fg: isD ? '#fff' : '#0B1115', sub: isD ? '#9AA7FF' : '#4A545B',\n          outline: key === todayKey && now.getFullYear() === 2026 ? '2px solid #2A3DE0' : 'none',\n          tasks, addShow: inRange ? 'block' : 'none', btnShow: adding ? 'none' : 'block', inputShow: adding ? 'block' : 'none',\n          open: () => this.setState({ adding: key, draft: '' }),\n          keydown: (e) => {\n            if (e.key === 'Enter' && S.draft.trim()) { const v = S.draft.trim(); this.save({ custom: Object.assign({}, S.custom, { [key]: (S.custom[key] || []).concat(v) }), adding: null, draft: '' }); }\n            if (e.key === 'Escape') this.setState({ adding: null, draft: '' });\n          },\n        });\n      }\n      total += rt; doneN += rd;\n      rows.push({ label: labels[r], count: rd + ' de ' + rt + ' concluídas', days, note: S.notes[r] || '', onNote: (e) => this.save({ notes: Object.assign({}, S.notes, { [r]: e.target.value }) }) });\n    }\n    return {\n      pad: S.mobile ? '24px 16px 64px' : '48px 40px 96px', headCols: S.mobile ? 'minmax(0,1fr)' : 'minmax(0,3fr) minmax(280px,2fr)',\n      minW: S.mobile ? '0' : '1040px', dowShow: S.mobile ? 'none' : 'grid', gridCols: S.mobile ? 'minmax(0,1fr)' : 'repeat(7,minmax(0,1fr))', cellMin: S.mobile ? '0' : '150px',\n      dows, rows, draft: S.draft, onDraft: (e) => this.setState({ draft: e.target.value }), cancelAdd: () => this.setState({ adding: null, draft: '' }),\n      progressLabel: doneN + ' de ' + total + ' · ' + (total ? Math.round(doneN / total * 100) : 0) + '%', progressPct: (total ? doneN / total * 100 : 0) + '%',\n    };\n  }\n}\n<\u002Fscript>\n\n\n<\u002Fbody><\u002Fhtml>"
  </script>
